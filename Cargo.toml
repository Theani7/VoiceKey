[workspace]
members = [
    "crates/core",
    "crates/audio",
    "crates/text",
    "crates/macos",
    "crates/asr",
    "crates/platform",
    "apps/macos/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VoiceKey Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicekey-ml"
version = "0.1.0"
description = "VoiceKey Machine Learning & ASR Engine for Nepali"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "soundfile>=0.12",
    "numpy>=1.24",
    "huggingface-hub==0.23.2",
    "jiwer>=3.0",
    "transformers<4.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceKey</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-layout">
    <!-- Native macOS Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <img src="icon.png" class="brand-app-icon" alt="VoiceKey Icon" />
        <div class="brand-titles">
          <span class="brand-title">VoiceKey</span>
          <span class="brand-sub">Native Voice AI</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">General</div>
        <div class="nav-item active" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Overview</span>
        </div>

        <div class="nav-item" data-view="models">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Models</span>
          <span class="nav-badge" id="models-count-badge">2</span>
        </div>

        <div class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 16 14"></polyline>
          </svg>
          <span>History</span>
        </div>

        <div class="sidebar-section-label" style="margin-top: 6px;">System</div>
        <div class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </div>

        <div class="nav-item" data-view="about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>About</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-cmd-palette" class="shortcut-trigger">
          <span>Quick Commands</span>
          <span class="kbd">⌘ K</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-content">
      <header class="app-toolbar" id="app-toolbar">
        <div class="toolbar-title" id="toolbar-title">Overview</div>
        <div class="toolbar-actions" id="toolbar-actions">
          <span class="kbd">⌥ Space</span>
        </div>
      </header>
      <div class="content-scroll" id="content-body">
        <!-- Rendered by app.js -->
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
